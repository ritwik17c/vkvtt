<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>VKVTT · QB Recovery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf6f1;color:#17364f;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:#1d638e;color:#fff;padding:18px}.wrap{max-width:760px;margin:auto;padding:0 16px}.card{background:#fff;border:1px solid #cbdce5;border-radius:18px;padding:20px;margin:22px 0;box-shadow:0 4px 18px #17324d0d}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{display:inline-block;font:inherit;font-weight:800;border:1px solid #b9ced9;border-radius:11px;padding:10px 14px;background:#e7f2f7;color:#17364f;text-decoration:none;cursor:pointer}.primary{background:#236d99;color:#fff}.ok{background:#e8f7ec;border:1px solid #b8ddc1;border-radius:12px;padding:12px;color:#245c34}.warn{background:#fff7df;border:1px solid #e5cd8c;border-radius:12px;padding:12px;color:#745917}.small{font-size:.86rem;color:#617685}#details{white-space:pre-wrap;word-break:break-word}</style>
</head>
<body>
<header><div class="wrap"><h1 style="margin:0">📚 Question Bank Recovery</h1><div>Lightweight access check · no question history is loaded</div></div></header>
<main class="wrap">
<section class="card">
<h2 id="title">Checking your VKVTT sign-in…</h2>
<div id="msg" class="small">This page does not load Question Bank records while starting.</div>
<div id="details" style="margin-top:14px"></div>
<div class="actions" style="margin-top:16px">
<button id="checkBtn" class="primary">Check my QB access</button>
<a class="btn" href="./">← Home</a>
</div>
</section>
</main>
<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import{getAuth,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';
const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=id=>document.getElementById(id),mail=v=>String(v||'').trim().toLowerCase();
async function run(){
 const u=auth.currentUser;
 if(!u){$('title').textContent='VKVTT sign-in not restored';$('msg').innerHTML='<div class="warn">Return Home, sign in to VKVTT, then open this page again.</div>';return}
 $('title').textContent='Checking authorised account…';$('msg').textContent=u.email||'';
 const email=mail(u.email);
 const [a,v,m]=await Promise.all([
   getDoc(doc(db,'authorizedUsers',u.uid)).catch(()=>null),
   email?getDoc(doc(db,'viewerEmails',email)).catch(()=>null):null,
   getDoc(doc(db,'master','current')).catch(()=>null)
 ]);
 let p=null;if(a?.exists()&&a.data().active!==false)p=a.data();else if(v?.exists()&&v.data().active!==false)p={role:'teacher',...v.data()};
 if(!p){$('title').textContent='QB access not authorised';$('msg').innerHTML='<div class="warn">This signed-in Google account is not currently authorised in VKVTT.</div>';return}
 const raw=m?.exists()?m.data()||{}:{},data=raw.data&&typeof raw.data==='object'?raw.data:{},master={...raw,...data};
 const emails=x=>[x?.email,x?.gmail,x?.googleEmail,x?.google_email,x?.officialEmail,x?.loginEmail,...(Array.isArray(x?.emails)?x.emails:[])].map(mail).filter(Boolean);
 const teachers=(master.teachers||[]).filter(Boolean);
 const tc=String(p.teacherCode||p.teacherShortCode||p.timetableCode||p.staffCode||p.code||'').trim();
 let teacher=teachers.find(t=>[t.code,t.shortCode,t.teacherShortCode,t.timetableCode].map(x=>String(x||'').trim()).includes(tc));
 if(!teacher)teacher=teachers.find(t=>emails(t).includes(email));
 if(!teacher){for(const[c,e]of Object.entries(master.teacherEmailMap||{})){if(mail(e)===email){teacher=teachers.find(t=>[t.code,t.shortCode,t.teacherShortCode,t.timetableCode].map(x=>String(x||'').trim()).includes(String(c).trim()));if(teacher)break}}}
 const isAdmin=String(p.role||'').toLowerCase()==='admin'||String(p.role||'').toLowerCase()==='principal';
 if(!teacher){$('title').textContent='Account authorised, teacher identity missing';$('msg').innerHTML='<div class="warn">VKVTT recognises this account, but the Question Bank cannot find its teaching identity.</div>';$('details').textContent='Role: '+(p.role||'staff')+'\nEmail: '+(u.email||'');return}
 $('title').textContent='QB access check passed';$('msg').innerHTML='<div class="ok">Your VKVTT account and teaching identity are both recognised. No Question Bank records were loaded during this test.</div>';
 $('details').textContent='Teacher: '+(teacher.name||u.displayName||'Teacher')+'\nRole: '+(isAdmin?'Principal/Admin + Teacher':(p.role||'Teacher'))+'\nEmail: '+(u.email||'');
}
$('checkBtn').onclick=run;
setTimeout(()=>{if(auth.currentUser)run();else{$('title').textContent='Ready to check QB access';$('msg').textContent='Press “Check my QB access”.'}},500);
</script>
</body>
</html>
