name: v66.2 correction batch
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/trigger-v66-2-corrections.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v66-2-refinement}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python tools/apply_v66_2_correction_batch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add period-notifications.js v66-home.js attendance.html admin-biometric-import.html v66-ui.js v66-home.css
          git diff --cached --quiet || git commit -m "Apply v66.2 preview corrections"
          git push
