name: v66.2 PWA integration
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/trigger-pwa-integration.txt']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - name: Copy exact approved icons already stored on main
        run: |
          git fetch origin main
          git show origin/main:icon-192-2.png > icon-192.png
          git show origin/main:icon-512-3.png > icon-512.png
      - name: Wire PWA into homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'rel="manifest"' not in s:
              marker='<meta name="viewport" content="width=device-width,initial-scale=1">'
              add='''\n<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#0b2f6b">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">\n<meta name="apple-mobile-web-app-title" content="VKVTT">\n<link rel="apple-touch-icon" href="./icon-192.png">'''
              s=s.replace(marker,marker+add,1)
          if 'navigator.serviceWorker.register' not in s:
              add='''\n<script>\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => {\n    navigator.serviceWorker.register('./sw.js').catch(err => console.error('Service worker registration failed:', err));\n  });\n}\n</script>\n'''
              s=s.replace('</body>',add+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html icon-192.png icon-512.png
          git diff --cached --quiet || git commit -m "Integrate VKVTT PWA package and approved icons"
          git push
