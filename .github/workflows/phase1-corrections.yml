name: phase1 corrections
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-phase1.txt']
permissions:
  contents: write
jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/phase1_patch.py
      - run: python tools/phase1_verify.py > PHASE1_VERIFY.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v66-home-cloud.js v66-home.js v66-premium-unified.css PHASE1_VERIFY.txt
          git commit -m "Apply and verify Phase 1 corrections"
          git push
