name: v66.2 period reminder patch
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/trigger-period-reminder.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v66-2-refinement}
      - name: Wire reminder engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="period-notifications.js?v=66.2" defer></script>'
          needle='<script src="v66-ui.js?v=66.0-school-identity-1" defer></script>'
          if tag not in s:
              if needle not in s: raise SystemExit('v66-ui loader not found')
              s=s.replace(needle,needle+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Wire activated-schedule period reminders into homepage"
          git push
