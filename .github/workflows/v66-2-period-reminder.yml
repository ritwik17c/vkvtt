name: v66.2 period reminder patch
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/trigger-period-reminder.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v66-2-refinement}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python tools/apply_period_reminder.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Wire activated-schedule period reminders into homepage"
          git push
