name: v66.2 six point sync
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-sixpoint-sync.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply_v66_2_sixpoint_sync.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Synchronize six-point preview package and restore v66.0 visual shell"
          git push
