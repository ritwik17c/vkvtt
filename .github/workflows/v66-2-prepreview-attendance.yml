name: v66.2 pre-preview attendance patch
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/trigger_v66_2_prepreview_attendance.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply_v66_2_prepreview_attendance.py
      - run: |
          git config user.name 'VKVTT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v66-home-cloud.js admin-attendance.html FIRESTORE_RULES_V66_REPLACE_ALL.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Enable all-staff attendance and biometric import security'
          git push origin v66-2-refinement
