name: v66.2 tail syntax repair
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-tail-syntax.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/fix_v66_2_tail_syntax.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v66-home.js v66-home-cloud.js
          git diff --cached --quiet || git commit -m "Repair v66.2 history override syntax"
          git push
