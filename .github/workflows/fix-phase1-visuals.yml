name: fix phase1 visuals
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-fix-phase1-visuals.txt']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - run: python tools/fix_phase1_visuals.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v66-premium-unified.css
          git commit -m 'Fix Swamiji rendering and restore v60 crest badge' || exit 0
          git push
