name: v66.2 visible fixes
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-visible-fixes.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply_v66_2_visible_fixes.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html swamiji-gold.svg admin-dashboard.html admin-leave-editor.html v66-home.js v66-home-cloud.js
          git diff --cached --quiet || git commit -m "Complete visible v66.2 preview corrections"
          git push
