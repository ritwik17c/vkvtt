name: Build Android APK

on:
  push:
    branches: [v66-2-refinement]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk VKV-Nalbari-Timetable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VKV-Nalbari-Timetable-APK
          path: VKV-Nalbari-Timetable.apk
          retention-days: 30
