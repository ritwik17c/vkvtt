name: VKVTT v66.2 Swamiji direct patch

on:
  workflow_dispatch:
  push:
    branches: [v66-2-refinement]
    paths:
      - tools/trigger_swamiji_direct.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - name: Apply prepared exact portrait patch
        run: python tools/apply_v66_2_patch_6.py
      - name: Validate patch
        run: |
          git diff --check
          node --check v66-home.js
          node --check v66-home-cloud.js
          test -f swamiji-gold.svg
          test -f swamiji-loader.svg
          grep -q 'swamijiHomePortrait' index.html
          grep -q 'vkvSwamijiLoader' v66-ui.js
          grep -q 'v66.2 Swamiji identity motif' v66-home.css
      - name: Commit application files
        run: |
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html v66-home.css v66-ui.js swamiji-gold.svg swamiji-loader.svg
          if git diff --cached --quiet; then echo 'Patch already applied'; exit 0; fi
          git commit -m "Add subtle Swamiji school identity refinement [skip ci]"
          git push origin HEAD:v66-2-refinement
