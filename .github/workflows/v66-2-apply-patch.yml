name: Apply VKVTT v66.2 refinement patch

on:
  push:
    branches:
      - v66-2-refinement
    paths:
      - tools/apply_v66_2_patch.py

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0

      - name: Apply exact v66.2 patch
        run: python tools/apply_v66_2_patch.py

      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for f in ['admin-dashboard.html','admin-leave-rules.html','admin-leave-editor.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert '<!doctype html>' in s.lower(), f
          print('HTML source validation passed')
          PY

      - name: Commit patched files
        run: |
          if git diff --quiet -- admin-dashboard.html admin-leave-rules.html admin-leave-editor.html; then
            echo "No target-file changes to commit."
            exit 0
          fi
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin-dashboard.html admin-leave-rules.html admin-leave-editor.html
          git commit -m "Fix leave admin session safety and dashboard loading [skip ci]"
          git push origin HEAD:v66-2-refinement
