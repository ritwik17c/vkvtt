name: v66.2 Swamiji face fix
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-swamiji-face-fix.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/extract_swamiji_portrait.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html swamiji-portrait.jpg
          git diff --cached --quiet || git commit -m "Fix Swamiji portrait rendering with standalone approved image"
          git push
