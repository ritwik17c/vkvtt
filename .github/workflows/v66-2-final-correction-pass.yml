name: v66.2 final correction pass
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-final-pass.txt']
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/apply_v66_2_final_pass.py
      - run: python tools/verify_v66_2_final_pass.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html' '*.css' '*.js' swamiji-portrait.jpg V66_2_FINAL_VERIFICATION.txt
          git diff --cached --quiet || git commit -m "Complete and verify v66.2 correction batch"
          git push
