name: v66.2 verified final correction
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-audit.txt']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          set +e
          python tools/apply_v66_2_final_pass.py > /tmp/apply.log 2>&1
          apply_code=$?
          if [ $apply_code -ne 0 ]; then
            echo "APPLY FAILED ($apply_code)" > /tmp/final_report.txt
            cat /tmp/apply.log >> /tmp/final_report.txt
            git restore .
            cp /tmp/final_report.txt V66_2_FINAL_VERIFICATION.txt
            echo fail > /tmp/outcome
            exit 0
          fi
          python tools/verify_v66_2_final_pass.py > /tmp/verify.log 2>&1
          verify_code=$?
          if [ -f V66_2_FINAL_VERIFICATION.txt ]; then cp V66_2_FINAL_VERIFICATION.txt /tmp/final_report.txt; else cp /tmp/verify.log /tmp/final_report.txt; fi
          if [ $verify_code -ne 0 ]; then
            echo "" >> /tmp/final_report.txt
            echo "VERIFY EXIT=$verify_code" >> /tmp/final_report.txt
            git restore .
            cp /tmp/final_report.txt V66_2_FINAL_VERIFICATION.txt
            echo fail > /tmp/outcome
          else
            echo pass > /tmp/outcome
          fi
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$(cat /tmp/outcome)" = "pass" ]; then
            git add '*.html' '*.css' '*.js' swamiji-portrait.jpg V66_2_FINAL_VERIFICATION.txt
            git diff --cached --quiet || git commit -m "Complete and verify v66.2 correction batch"
          else
            git add V66_2_FINAL_VERIFICATION.txt
            git diff --cached --quiet || git commit -m "Record failed v66.2 verification"
          fi
          git push
