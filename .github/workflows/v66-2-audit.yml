name: v66.2 audit diagnostic
on:
  push:
    branches: [v66-2-refinement]
    paths: ['tools/run-v66-2-audit.txt']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          set +e
          python -m py_compile tools/apply_v66_2_final_pass.py tools/verify_v66_2_final_pass.py > V66_2_COMPILE.txt 2>&1
          code=$?
          echo "EXIT=$code" >> V66_2_COMPILE.txt
          exit 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V66_2_COMPILE.txt
          git diff --cached --quiet || git commit -m "Diagnose v66.2 correction scripts"
          git push
