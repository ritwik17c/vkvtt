name: Apply dynamic leave filter refinement
on:
  push:
    branches: [v66-2-refinement]
    paths: [tools/apply_dynamic_leave_filter_fix.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - run: python tools/apply_dynamic_leave_filter_fix.py
      - name: Validate
        run: |
          git diff --check
          grep -q "refreshCategoryStatusFilter" admin-leave-editor.html
          grep -q "Duty Leave · OD" admin-leave-editor.html
          grep -q "historicalCategories" admin-leave-editor.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin-leave-editor.html
          git commit -m "Make leave history filter follow configurable categories [skip ci]"
          git push origin HEAD:v66-2-refinement
