name: Apply VKVTT v66.2 refinement patch runner

on:
  push:
    branches:
      - v66-2-refinement
    paths:
      - tools/trigger_proven_runner.txt

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - name: Apply Swamiji identity refinement
        run: python tools/apply_v66_2_patch_6.py
      - name: Validate
        run: |
          git diff --check
          node --check v66-home.js
          node --check v66-home-cloud.js
          test -f assets/swamiji-line-gold.jpg
          echo "Swamiji identity validation passed"
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add subtle Swamiji school identity refinement [skip ci]"
          git push origin HEAD:v66-2-refinement
