name: Apply VKVTT v66.2 refinement patch runner

on:
  push:
    branches:
      - v66-2-refinement
    paths:
      - tools/trigger_proven_runner.txt

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - name: Apply Duty Leave separation patch
        run: python tools/apply_v66_2_patch_4.py
      - name: Validate
        run: |
          git diff --check
          node --check v66-home.js
          node --check v66-home-cloud.js
          python - <<'PY'
          from pathlib import Path
          a=Path('admin-leave-editor.html').read_text(encoding='utf-8')
          b=Path('admin-leave.html').read_text(encoding='utf-8')
          c=Path('index.html').read_text(encoding='utf-8')
          assert 'leaveRecords=records.filter' in a
          assert 'Duty Leave History' in b
          assert 'Leave / Duty Leave / Operational Status' in c
          print('Duty Leave separation validation passed')
          PY
      - name: Commit patched files
        run: |
          if git diff --quiet -- index.html admin-leave-editor.html admin-leave.html v66-home.js v66-home-cloud.js; then
            echo "No target-file changes to commit."
            exit 0
          fi
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin-leave-editor.html admin-leave.html v66-home.js v66-home-cloud.js
          git commit -m "Separate Leave, Duty Leave and operational status [skip ci]"
          git push origin HEAD:v66-2-refinement
