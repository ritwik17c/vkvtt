name: Apply VKVTT v66.2 refinement patch runner

on:
  push:
    branches:
      - v66-2-refinement
    paths:
      - tools/trigger_proven_runner.txt

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - name: Apply date/button/navigation patch
        run: python tools/apply_v66_2_patch_5.py
      - name: Validate
        run: |
          git diff --check
          node --check v66-home.js
          node --check v66-home-cloud.js
          python - <<'PY'
          from pathlib import Path
          a=Path('admin-leave-rules.html').read_text(encoding='utf-8')
          b=Path('v66-home.css').read_text(encoding='utf-8')
          c=Path('v66-design-system.css').read_text(encoding='utf-8')
          assert 'Start date (dd/mm/yyyy)' in a
          assert 'vkv-selected-gold-outline' in b
          assert 'outline: 2px solid var(--vkv-gold-500)' in c
          print('Date/button/navigation validation passed')
          PY
      - name: Commit patched files
        run: |
          if git diff --quiet -- admin-leave-rules.html v66-home.css v66-design-system.css v66-home.js v66-home-cloud.js index.html admin-dashboard.html admin-leave.html admin-leave-editor.html; then
            echo "No target-file changes to commit."
            exit 0
          fi
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin-leave-rules.html v66-home.css v66-design-system.css v66-home.js v66-home-cloud.js index.html admin-dashboard.html admin-leave.html admin-leave-editor.html
          git commit -m "Standardise dates, selected buttons and same-tab navigation [skip ci]"
          git push origin HEAD:v66-2-refinement
