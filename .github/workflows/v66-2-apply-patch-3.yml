name: Apply VKVTT v66.2 leave terminology patch

on:
  push:
    branches:
      - v66-2-refinement
    paths:
      - tools/apply_v66_2_patch_3.py
      - tools/trigger_v66_2_patch_3.txt
      - .github/workflows/v66-2-apply-patch-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-2-refinement
          fetch-depth: 0
      - name: Apply exact terminology patch and capture result
        id: apply
        shell: bash
        run: |
          set +e
          python tools/apply_v66_2_patch_3.py > tools/patch3-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat tools/patch3-diagnostic.log
          exit 0
      - name: Validate changed sources
        if: steps.apply.outputs.exit_code == '0'
        run: |
          git diff --check
          node --check v66-home.js
          python - <<'PY'
          from pathlib import Path
          for f in ['admin-leave-rules.html','admin-leave-editor.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert 'Conditional / Special Leave' in s
          print('Terminology validation passed')
          PY
      - name: Commit target changes or diagnostic
        shell: bash
        run: |
          git config user.name "VKVTT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.apply.outputs.exit_code }}" != "0" ]; then
            git restore -- admin-leave-rules.html admin-leave-editor.html v66-home.js v66-home-cloud.js || true
            git add tools/patch3-diagnostic.log
            git commit -m "Record v66.2 terminology patch diagnostic [skip ci]" || exit 0
            git push origin HEAD:v66-2-refinement
            exit 0
          fi
          rm -f tools/patch3-diagnostic.log
          if git diff --quiet -- admin-leave-rules.html admin-leave-editor.html v66-home.js v66-home-cloud.js; then
            echo "No target changes"
            exit 0
          fi
          git add admin-leave-rules.html admin-leave-editor.html v66-home.js v66-home-cloud.js
          git commit -m "Integrate leave types, staff categories and conditional eligibility [skip ci]"
          git push origin HEAD:v66-2-refinement
