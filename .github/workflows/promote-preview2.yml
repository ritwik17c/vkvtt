name: Promote Preview 2 to Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-preview2.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          path: production
          ref: main
          fetch-depth: 0

      - name: Checkout tested Preview 2 candidate
        uses: actions/checkout@v4
        with:
          repository: ritwik17c/vkvtt-preview-2
          ref: main
          path: preview
          fetch-depth: 1

      - name: Promote Preview 2 application tree
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            preview/ production/

      - name: Build production cache and path handling
        shell: python
        run: |
          from pathlib import Path
          sw = Path('production/sw.js')
          text = sw.read_text(encoding='utf-8')
          lines = text.splitlines()
          lines[0] = "const CACHE_NAME='vkvtt-shell-2026-09-09-production-main-1';"
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          text = text.replace(
              "const isHome=/\\/index\\.html$/i.test(path)||/\\/vkvtt-preview-2\\/?$/i.test(path);",
              "const isHome=/\\/index\\.html$/i.test(path)||/\\/(?:vkvtt-preview-2|vkvtt)\\/?$/i.test(path);"
          )
          sw.write_text(text, encoding='utf-8')

          theme = Path('production/vkv-theme.js')
          if theme.exists():
              t = theme.read_text(encoding='utf-8')
              t = t.replace("./sw.js?v=20260909-theme8", "./sw.js?v=20260909-production-main1")
              theme.write_text(t, encoding='utf-8')

          Path('production/PRODUCTION_PROMOTION_2026-09-09.txt').write_text(
              'Promoted from ritwik17c/vkvtt-preview-2 main on 2026-09-09.\n'
              'Production cache: vkvtt-shell-2026-09-09-production-main-1\n',
              encoding='utf-8'
          )

      - name: Commit promoted production candidate
        working-directory: production
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes to commit."
            exit 0
          fi
          git commit -m "Promote tested Preview 2 candidate to production"
          git push origin main
