<style>

<body>
<header><div class="head"><div class="mark">SG</div><div><h1>Student Growth · Skolens</h1><p>VKV Nalbari · See the whole student.</p></div><div class="spacer"></div><button class="homeBtn" onclick="location.href='index.html'">← VKVTT Home</button></div></header>
<div id="authGate"><div class="authTitle">Opening Student Growth…</div><div id="authMsg" class="authMsg">Checking your VKVTT Google account and school access.</div><button id="signInBtn" class="btn primary hidden">Continue with Google</button></div>
<div id="app" class="shell hidden">
  <div class="identity"><div><strong id="who">—</strong><small id="roleText">—</small></div><div class="spacer"></div><button id="signOutBtn" class="btn small">Sign out</button></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';

import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, getDocs, query, where, orderBy, limit, serverTimestamp, writeBatch } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider();
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,profile=null,isAdmin=false,teacherCode='',teacherName='',master=null,students=[],observations=[],followups=[],route='dashboard',importRows=[];
const TOPICS=['Leadership','Responsibility','Helpful','Honesty','Punctuality','Improvement','Participation','Initiative','Teamwork','Empathy','Communication','English Communication','Neat Work','Homework','Academic Improvement','Sportsmanship','Creativity','Cultural','Seva','Environment','Attendance','Classroom Behaviour','Discipline','Safety','Peer Relations','Repeated Concern'];
function normEmail(v){return String(v||'').trim().toLowerCase()}function normName(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ')}
function displayDate(v){if(!v)return '—';if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}return String(v)}
function dateKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parseExcelDate(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return dateKey(v);if(typeof v==='number'&&window.XLSX){const x=XLSX.SSF.parse_date_code(v);if(x)return `${x.y}-${String(x.m).padStart(2,'0')}-${String(x.d).padStart(2,'0')}`}const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);if(m){let y=m[3];if(y.length===2)y=(Number(y)>50?'19':'20')+y;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;return ''}
function todayDisplay(){return displayDate(dateKey())}
function pageHead(title,sub,actions=''){return `<div class="pageHead"><div><h2>${title}</h2><p>${sub}</p></div><div class="spacer"></div><div class="actions">${actions}</div></div>`}
function metric(n,label){return `<div class="card metric"><b>${n}</b><small>${label}</small></div>`}

async function identifyStaff(){
 const ms=await getDoc(doc(db,'master','current'));if(!ms.exists())throw new Error('VKVTT master data is unavailable.');master=ms.data().data||ms.data();
 const p=await getDoc(doc(db,'authorizedUsers',user.uid));
 if(p.exists()&&p.data().active===true){profile=p.data();isAdmin=profile.role==='admin'}
 if(!profile){const em=normEmail(user.email);const ve=em?await getDoc(doc(db,'viewerEmails',em)):null;if(!ve||!ve.exists()||ve.data().active!==true)throw new Error('This Google account is not authorised in VKVTT.');profile={...ve.data(),role:ve.data().role||'viewer'}}
 const email=normEmail(user.email),people=[...(master.teachers||[]),...(master.nonTeachingStaff||[])].filter(x=>x&&x.active!==false);
 const mapped=Object.entries(master.teacherEmailMap||{}).find(([c,e])=>normEmail(e)===email);
 if(mapped)teacherCode=String(mapped[0]);
 if(!teacherCode){const hits=people.filter(t=>[t.email,t.gmail,t.googleEmail,t.google_email].some(e=>normEmail(e)===email));if(hits.length===1)teacherCode=String(hits[0].code||'')}
 if(!teacherCode&&profile.teacherCode)teacherCode=String(profile.teacherCode);
 const person=people.find(x=>String(x.code||'')===teacherCode);teacherName=person?.name||profile.name||user.displayName||user.email;
 if(!isAdmin&&!teacherCode)throw new Error('Your VKVTT account is authorised, but it is not linked to an individual teacher record yet. Ask the Principal/Admin to map your Google email to your teacher code.');
}
async function loadCore(){
 const [ss,os,fs]=await Promise.all([getDocs(collection(db,'students')),getDocs(query(collection(db,'studentGrowthObservations'),orderBy('createdAt','desc'),limit(150))),getDocs(query(collection(db,'studentGrowthFollowups'),where('status','==','open'),limit(150)))]);
 students=ss.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status!=='archived').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
 observations=os.docs.map(d=>({id:d.id,...d.data()}));followups=fs.docs.map(d=>({id:d.id,...d.data()}));
}
function drawNav(){const items=[['dashboard','⌂ Dashboard'],['students','👥 Students'],['quick','＋ Quick Record'],['followups','✓ Follow-ups']];if(isAdmin)items.push(['import','⇧ Student Import']);$('nav').innerHTML=items.map(([r,t])=>`<button data-r="${r}" class="${route===r?'active':''}">${t}${r==='import'?'<span class="adminBadge">Admin</span>':''}</button>`).join('');$('nav').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{route=b.dataset.r;drawNav();render()})}
function render(){({dashboard:renderDashboard,students:renderStudents,quick:renderQuick,followups:renderFollowups,import:renderImport}[route]||renderDashboard)()}
function studentLabel(s){return `${s.name||'Student'} · ${s.standard||''}${s.division?' '+s.division:''}${s.rollNo?` · Roll ${s.rollNo}`:''}`}
function renderDashboard(){
 const mine=observations.filter(o=>isAdmin||o.createdByUid===user.uid),positive=mine.filter(o=>o.nature==='Positive').length,concern=mine.filter(o=>o.nature==='Concern').length,open=followups.filter(f=>isAdmin||f.ownerUid===user.uid).length;
 $('view').innerHTML=pageHead('Student Growth Dashboard',isAdmin?'Leadership view across student growth records.':'Your student observations and follow-ups.',`<button id="dashQuick" class="btn primary">＋ Record Observation</button>`)+`<div class="grid metrics">${metric(students.length,'Students')}${metric(mine.length,isAdmin?'Recent observations':'Your recent observations')}${metric(positive,'Positive')}${metric(open,'Open follow-ups')}</div><div class="card"><h3 style="margin-top:0">Recent observations</h3>${mine.slice(0,10).map(o=>recordHtml(o)).join('')||'<div class="empty">No observations yet.</div>'}</div>`;$('dashQuick').onclick=()=>{route='quick';drawNav();render()}}
function recordHtml(o){const s=students.find(x=>x.id===o.studentId);return `<div class="recordItem"><div class="date">${displayDate(o.date)}</div><div><strong>${esc(s?.name||o.studentName||'Student')}</strong><div class="text">${esc(o.text||'')}</div><div class="topics">${(o.topics||[]).map(esc).join(' · ')}</div></div><div class="nature ${esc(o.nature||'General')}">${esc(o.nature||'General')}</div></div>`}
function renderStudents(){
 $('view').innerHTML=pageHead('Students','Search the student master used by Student Growth.',isAdmin?'<button id="goImport" class="btn">⇧ Import Excel</button>':'')+`<div class="toolbar"><input id="sq" placeholder="Search name, GR No., class…"><select id="sc"><option value="">All classes</option>${[...new Set(students.map(s=>`${s.standard||''} ${s.division||''}`.trim()))].filter(Boolean).sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="studentTable"></div>`;
 if(isAdmin)$('goImport').onclick=()=>{route='import';drawNav();render()};$('sq').oninput=drawStudents;$('sc').onchange=drawStudents;drawStudents();
}
function drawStudents(){const q=normName($('sq').value),c=$('sc').value,arr=students.filter(s=>(!q||normName([s.name,s.grNo,s.standard,s.division,s.rollNo].join(' ')).includes(q))&&(!c||`${s.standard||''} ${s.division||''}`.trim()===c));$('studentTable').innerHTML=arr.length?`<div class="tableWrap"><table><tr><th>GR No.</th><th>Name</th><th>Class</th><th>Roll</th><th>Gender</th><th>DOB</th><th></th></tr>${arr.map(s=>`<tr><td>${esc(s.grNo||'—')}</td><td><b>${esc(s.name||'')}</b></td><td>${esc(s.standard||'')} ${esc(s.division||'')}</td><td>${esc(s.rollNo||'—')}</td><td>${esc(s.gender||'—')}</td><td>${displayDate(s.birthDate)}</td><td><button class="btn small" data-rec="${s.id}">Record</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">No matching students.</div>';$('studentTable').querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{route='quick';drawNav();renderQuick(b.dataset.rec)})}
function renderQuick(prefill=''){
 const opts=students.map(s=>`<option value="${s.id}" ${s.id===prefill?'selected':''}>${esc(studentLabel(s))}</option>`).join('');
 $('view').innerHTML=pageHead('Quick Record','Record a factual observation. Positive records receive equal prominence to concerns.')+`<div class="card"><div class="formgrid"><div class="field full"><label>Student *</label><select id="qrStudent"><option value="">Select student…</option>${opts}</select></div><div class="field"><label>Date</label><input id="qrDate" value="${todayDisplay()}" readonly></div><div class="field"><label>Nature *</label><select id="qrNature"><option>Positive</option><option selected>General</option><option>Concern</option></select></div><div class="field full"><label>Topics</label><div id="topicChips" class="chips">${TOPICS.map(t=>`<button type="button" class="chip" data-topic="${esc(t)}">${esc(t)}</button>`).join('')}</div></div><div class="field full"><label>Observation *</label><textarea id="qrText" placeholder="State what was observed factually. Avoid labels or assumptions."></textarea></div><div class="field"><label><input id="qrFollow" type="checkbox"> Follow-up required</label></div><div class="field"><label>Follow-up date</label><input id="qrFollowDate" type="date"></div></div><div id="qrMsg" style="margin-top:10px"></div><div class="actions"><button id="saveRecord" class="btn primary">Save Observation</button></div></div>`;
 $('topicChips').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));$('saveRecord').onclick=saveObservation;
}
async function saveObservation(){const sid=$('qrStudent').value,text=$('qrText').value.trim(),nature=$('qrNature').value,topics=[...$('topicChips').querySelectorAll('.on')].map(x=>x.dataset.topic),need=$('qrFollow').checked,fd=$('qrFollowDate').value,s=students.find(x=>x.id===sid),msg=$('qrMsg');if(!s||!text){msg.className='error';msg.textContent='Select a student and enter the observation.';return}if(need&&!fd){msg.className='error';msg.textContent='Choose a follow-up date.';return}const btn=$('saveRecord');btn.disabled=true;try{const ref=await addDoc(collection(db,'studentGrowthObservations'),{studentId:s.id,studentName:s.name||'',grNo:s.grNo||'',className:s.standard||'',division:s.division||'',date:dateKey(),nature,topics,text,createdByUid:user.uid,createdByEmail:normEmail(user.email),createdByTeacherCode:teacherCode||'',createdByName:teacherName||user.displayName||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});if(need)await addDoc(collection(db,'studentGrowthFollowups'),{studentId:s.id,studentName:s.name||'',observationId:ref.id,title:`Follow up: ${s.name}`,dueDate:fd,status:'open',ownerUid:user.uid,ownerEmail:normEmail(user.email),ownerTeacherCode:teacherCode||'',ownerName:teacherName||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});msg.className='success';msg.textContent='Observation saved.';await loadCore();setTimeout(()=>{route='dashboard';drawNav();render()},500)}catch(e){console.error(e);msg.className='error';msg.textContent='Could not save: '+(e.message||e)}finally{btn.disabled=false}}
function renderFollowups(){const arr=followups.filter(f=>isAdmin||f.ownerUid===user.uid).sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));$('view').innerHTML=pageHead('Follow-ups',isAdmin?'Open follow-ups across the school.':'Follow-ups assigned to you.')+`<div class="card">${arr.length?`<div class="tableWrap"><table><tr><th>Due</th><th>Student</th><th>Follow-up</th><th>Owner</th><th></th></tr>${arr.map(f=>`<tr><td>${displayDate(f.dueDate)}</td><td><b>${esc(f.studentName||'Student')}</b></td><td>${esc(f.title||'Follow-up')}</td><td>${esc(f.ownerName||'')}</td><td>${(isAdmin||f.ownerUid===user.uid)?`<button class="btn small good" data-close="${f.id}">Close</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">No open follow-ups.</div>'}</div>`;$('view').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeFollowup(b.dataset.close))}
async function closeFollowup(id){if(!confirm('Mark this follow-up as closed?'))return;try{await updateDoc(doc(db,'studentGrowthFollowups',id),{status:'closed',closedAt:serverTimestamp(),closedByUid:user.uid,updatedAt:serverTimestamp()});await loadCore();renderFollowups()}catch(e){alert('Could not close follow-up: '+(e.message||e))}}

const HEADERS={srNo:['sr no.','sr no','srno','serial no','serial number'],grNo:['gr no.','gr no','grno','admission no','admission no.'],name:['name','student name'],standard:['standard','class'],division:['division','section'],rollNo:['rollno','roll no','roll no.','roll number'],gender:['gender','sex'],birthDate:['birth date','birthdate','date of birth','dob']};
function keyOf(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}function headerMap(row){const out={};Object.entries(HEADERS).forEach(([field,aliases])=>{const i=row.findIndex(v=>aliases.includes(keyOf(v)));if(i>=0)out[field]=i});return out}
function renderImport(){if(!isAdmin){route='dashboard';render();return}$('view').innerHTML=pageHead('Student Import','Principal/Admin only · Excel preview is required before anything is saved.')+`<div class="guide"><b>Supported school format:</b> SR No. · GR No. · Name · Standard · Division · RollNo · Gender · Birth Date</div><div class="card importBox"><input id="studentFile" type="file" accept=".xlsx,.xls"><div id="importMsg" class="muted" style="margin-top:9px">Choose the existing school Excel file. Title rows above the real header are allowed.</div></div><div id="importPreview" style="margin-top:13px"></div>`;$('studentFile').onchange=readImport}
async function readImport(e){const f=e.target.files?.[0],msg=$('importMsg');if(!f)return;msg.textContent='Reading '+f.name+'…';try{const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});let hi=-1,map=null;for(let i=0;i<Math.min(rows.length,30);i++){const m=headerMap(rows[i]);if(m.name!=null&&m.grNo!=null&&m.standard!=null){hi=i;map=m;break}}if(hi<0)throw new Error('Could not find the student header row. Expected at least GR No., Name and Standard.');importRows=rows.slice(hi+1).map((r,n)=>({rowNo:hi+n+2,srNo:r[map.srNo]??'',grNo:String(r[map.grNo]??'').trim(),name:String(r[map.name]??'').trim(),standard:String(r[map.standard]??'').trim(),division:String(r[map.division]??'').trim(),rollNo:String(r[map.rollNo]??'').trim(),gender:String(r[map.gender]??'').trim(),birthDate:parseExcelDate(r[map.birthDate])})).filter(x=>x.name||x.grNo||x.standard);const existingGR=new Set(students.map(s=>String(s.grNo||'').trim().toLowerCase()).filter(Boolean)),seen=new Set();importRows.forEach(x=>{x.errors=[];if(!x.name)x.errors.push('Name missing');if(!x.grNo)x.errors.push('GR No. missing');if(!x.standard)x.errors.push('Standard missing');const g=x.grNo.toLowerCase();if(g&&seen.has(g))x.errors.push('Duplicate GR No. in file');if(g)seen.add(g);if(g&&existingGR.has(g))x.errors.push('GR No. already exists');if((r=>r!==''&&!x.birthDate)(rows[x.rowNo-1]?.[map.birthDate]))x.errors.push('Invalid Birth Date')});msg.textContent=`Header found on row ${hi+1}. ${importRows.length} student row(s) read.`;drawImportPreview()}catch(err){console.error(err);msg.className='error';msg.textContent=err.message||err}}
function drawImportPreview(){const bad=importRows.filter(x=>x.errors.length),ok=importRows.length-bad.length;$('importPreview').innerHTML=`<div class="previewStats"><span>${importRows.length} rows</span><span>${ok} ready</span><span>${bad.length} need attention</span></div><div class="card"><div class="tableWrap"><table><tr><th>Row</th><th>GR No.</th><th>Name</th><th>Standard</th><th>Division</th><th>RollNo</th><th>Gender</th><th>Birth Date</th><th>Validation</th></tr>${importRows.slice(0,250).map(x=>`<tr><td>${x.rowNo}</td><td>${esc(x.grNo)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.standard)}</td><td>${esc(x.division)}</td><td>${esc(x.rollNo)}</td><td>${esc(x.gender)}</td><td>${displayDate(x.birthDate)}</td><td class="${x.errors.length?'error':'success'}">${x.errors.length?esc(x.errors.join('; ')):'Ready'}</td></tr>`).join('')}</table></div>${importRows.length>250?'<div class="muted" style="margin-top:9px">Showing first 250 rows in preview.</div>':''}<div id="commitMsg" style="margin-top:10px"></div><div class="actions"><button id="commitImport" class="btn primary" ${bad.length||!importRows.length?'disabled':''}>Confirm Import (${ok})</button></div></div>`;const b=$('commitImport');if(b&&!b.disabled)b.onclick=commitImport}
async function commitImport(){if(!isAdmin||!importRows.length||importRows.some(x=>x.errors.length))return;if(!confirm(`Import ${importRows.length} students into Student Growth?`))return;const btn=$('commitImport'),msg=$('commitMsg');btn.disabled=true;msg.textContent='Saving students…';try{for(let start=0;start<importRows.length;start+=350){const batch=writeBatch(db);for(const x of importRows.slice(start,start+350)){const ref=doc(collection(db,'students'));batch.set(ref,{srNo:String(x.srNo||''),grNo:x.grNo,name:x.name,standard:x.standard,division:x.division,rollNo:x.rollNo,gender:x.gender,birthDate:x.birthDate,status:'active',source:'excel-import',importedByUid:user.uid,importedByEmail:normEmail(user.email),createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}await batch.commit()}msg.className='success';msg.textContent=`Imported ${importRows.length} students successfully.`;importRows=[];await loadCore();setTimeout(()=>{route='students';drawNav();render()},700)}catch(e){console.error(e);msg.className='error';msg.textContent='Import failed. No further batches were written: '+(e.message||e);btn.disabled=false}}

$('signInBtn').onclick=async()=>{provider.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,provider)}catch(e){$('authMsg').textContent='Sign-in failed: '+(e.message||e)}};$('signOutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u;$('app').classList.add('hidden');$('authGate').classList.remove('hidden');$('signInBtn').classList.add('hidden');if(!u){$('authMsg').textContent='Sign in with your authorised VKVTT Google account.';$('signInBtn').classList.remove('hidden');return}try{$('authMsg').textContent='Verifying VKVTT access…';await identifyStaff();$('authMsg').textContent='Loading Student Growth…';await loadCore();$('who').textContent=teacherName||u.displayName||u.email;$('roleText').textContent=isAdmin?'Principal / Admin':`Teacher${teacherCode?' · '+teacherCode:''}`;$('authGate').classList.add('hidden');$('app').classList.remove('hidden');drawNav();render()}catch(e){console.error(e);$('authMsg').textContent=e.message||String(e);$('signInBtn').classList.remove('hidden')}});
</script>
