<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:#123d68;color:#fff;padding:14px 18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{margin:0;font-size:1.25rem}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,button{font:inherit;font-weight:800;border:1px solid #b9ced9;border-radius:10px;padding:9px 12px;background:#eef7fb;color:var(--ink);text-decoration:none;cursor:pointer}.primary{background:var(--deep);color:#fff;border-color:var(--deep)}.danger{background:#fdecec;color:var(--danger);border-color:#e5b7b7}.wrap{max-width:1240px;margin:auto;padding:16px 14px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 4px 16px #17324d0d}.status{padding:11px 13px;border-radius:11px;background:#eef7fb;border:1px solid #c9dfe9}.ok{background:#e7f6ea;color:var(--ok);border-color:#acd5b5}.warn{background:#fff5d9;color:var(--amber);border-color:#e3cc86}.filters{display:grid;grid-template-columns:1.2fr .8fr 1fr auto;gap:10px;align-items:end}.filters label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}.filters select,.filters input{width:100%;padding:10px;border:1px solid #c7d5de;border-radius:9px;background:#fff;font:inherit}.summary{font-size:.87rem;color:var(--muted);margin:10px 0}.record{border:1px solid #d7e3e9;border-left:5px solid #67a1c5;border-radius:13px;padding:13px;margin:9px 0;background:#fbfefd}.recordTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.title{font-weight:900}.meta{font-size:.84rem;color:var(--muted);line-height:1.5;margin-top:3px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e9f3f7;font-size:.73rem;font-weight:800;margin-right:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:22px;text-align:center;color:var(--muted);background:#f7fafb;border-radius:11px}.hidden{display:none!important}#editShell{padding:0}#editBar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0}#editorFrame{display:block;width:100%;height:calc(100vh - 130px);min-height:650px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:#edf6f1}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters{grid-template-columns:1fr}}
</style>
<script src="./vkv-theme.js?v=20260916-theme-layout-2"></script>

<body>
<header><div class="head"><h1>🛠 Full Leave / Duty Edit</h1><div class="nav"><a class="btn" href="./admin-leave.html?v=66.4">Approved Register</a><a class="btn" href="./leave-manager.html?v=20260916-unified-leave-3">Leave Management</a></div></div></header>
<main class="wrap">
<section id="historyShell" class="card">
  <div id="gate" class="status">Checking Principal/Admin access…</div>
  <div id="app" class="hidden">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px"><div><h2 style="margin:0">Approved Leave / Duty History</h2><div class="summary">Select one staff member. Edit or delete directly from the same list.</div></div><button id="newBtn" class="primary">＋ New Approved Record</button></div>
    <div class="filters"><div><label>Staff member</label><select id="staff"><option value="">Select staff member…</option></select></div><div><label>Category / status</label><select id="type"><option value="">All</option><option value="CL">CL</option><option value="EL">EL</option><option value="VL">VL</option><option value="SEL">SEL</option><option value="EOL">EOL</option><option value="MATERNITY">Maternity</option><option value="od">On Duty</option><option value="special">Special Assignment</option></select></div><div><label>Search</label><input id="search" placeholder="Remarks, source, date…"></div><button id="reset">Reset</button></div>
    <div id="summary" class="summary"></div><div id="records"></div>
  </div>
</section>
<section id="editShell" class="hidden"><div id="editBar"><div><b id="editTitle">Editing approved record</b><div class="summary" style="margin:2px 0 0">Only the actual edit form is shown below.</div></div><button id="backBtn">← Back to history</button></div><iframe id="editorFrame" src="about:blank"></iframe></section>
</main>
<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import{getAuth,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import{getFirestore,doc,getDoc,getDocs,collection,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';
const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);await setPersistence(auth,browserLocalPersistence).catch(()=>{});if(auth.authStateReady)await auth.authStateReady().catch(()=>{});
let M={},aliases={},rows=[],user=null,pendingEdit=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s||'—')};
function canonical(c){c=String(c||'').trim();const seen=new Set();while(c&&aliases[c]&&!seen.has(c)){seen.add(c);c=String(aliases[c]||'').trim()}return c}
function datesOf(p){if(Array.isArray(p.dates)&&p.dates.length)return[...new Set(p.dates.filter(Boolean))].sort();const a=p.startDate||p.date||p.fromDate||'',b=p.endDate||p.toDate||a;if(!a)return[];if(!b||a===b)return[a];const out=[],d=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00');for(let i=0;d<=z&&i<370;i++,d.setDate(d.getDate()+1))out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return out}
function typeOf(x){let t=String(x.type||x.statusType||'').toLowerCase();if(['leave','regularleave','regular leave'].includes(t))t=String(x.coverage||x.duration||'').toLowerCase().includes('half')?'half':'full';if(['on duty','duty','duty leave'].includes(t))t='od';if(['special assignment','assignment'].includes(t))t='special';return t}
function label(r){return r.type==='od'?'On Duty (OD)':r.type==='special'?'Special Assignment':r.type==='half'?'Half Leave':r.cat||'Full Leave'}
function staffList(){const map=new Map();for(const x of[...(M.teachers||[]),...(M.nonTeachingStaff||[]),...(M.staffDirectory||[])]){if(!x||x.active===false)continue;const raw=String(x.code||x.shortCode||x.teacherShortCode||x.timetableCode||x.employeeCode||'').trim(),code=canonical(raw)||raw;if(!code)continue;const name=String(x.name||x.fullName||code);if(!map.has(code)||map.get(code).name.length<name.length)map.set(code,{code,name})}return[...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function normalizePlan(id,x,source='approvedStatusPlans'){const e=Array.isArray(x.entries)&&x.entries.length?x.entries[0]:{},p={...x,...e};return{id,kind:'plan',code:canonical(p.code||p.teacherCode||p.staffCode||p.teacherShortCode||p.shortCode||''),type:typeOf(p),cat:String(p.leaveCategory||p.category||'').toUpperCase(),dates:datesOf(p),note:p.note||p.remarks||p.reason||'',source:p.source||source,raw:p}}
function manualKey(m){return`${m.docId}|${m.index}|${m.date}|${m.code}`}
async function verify(){user=auth.currentUser;if(!user)throw Error('Please sign in from VKVTT Home first.');const p=await getDoc(doc(db,'authorizedUsers',user.uid));if(!p.exists()||p.data().active!==true||String(p.data().role||'').toLowerCase()!=='admin')throw Error('Principal/Admin access is required.');const ms=await getDoc(doc(db,'master','current'));if(!ms.exists())throw Error('Master timetable is not available.');const raw=ms.data()||{},wrapped=raw.data&&typeof raw.data==='object'?raw.data:{};M={...raw,...wrapped};aliases=M.teacherCodeAliases||{}}
async function loadRows(){const [apR,mpR,drR]=await Promise.allSettled([getDocs(collection(db,'approvedStatusPlans')),getDoc(doc(db,'dailyRecords','__leavePlans')),getDocs(collection(db,'dailyRecords'))]);const map=new Map();if(apR.status==='fulfilled')apR.value.forEach(d=>{const x=d.data()||{};if(x.active!==false){const r=normalizePlan(d.id,x);if(['full','half','od','special'].includes(r.type)&&r.code)map.set('p:'+d.id,r)}});if(mpR.status==='fulfilled'&&mpR.value.exists())for(const[id,x]of Object.entries(mpR.value.data().plans||{})){if(!x||x.active===false)continue;const r=normalizePlan(id,x,'Leave Master');if(['full','half','od','special'].includes(r.type)&&r.code&&!map.has('p:'+id))map.set('p:'+id,r)}if(drR.status==='fulfilled')drR.value.forEach(d=>{if(d.id==='__leavePlans')return;const data=d.data()||{},date=data.date||d.id;(data.statuses||[]).forEach((x,i)=>{const t=typeOf(x);if(!['full','half','od','special'].includes(t))return;const code=canonical(x.code||x.teacherCode||x.staffCode||'');if(!code)return;const m={kind:'manual',docId:d.id,index:i,date,code,type:t,cat:String(x.leaveCategory||x.category||'').toUpperCase(),dates:[date],note:x.note||x.remarks||'',source:'Daily approved status',raw:x};map.set('m:'+manualKey(m),m)})});rows=[...map.values()].sort((a,b)=>String((b.dates||[])[0]||'').localeCompare(String((a.dates||[])[0]||'')))}
function render(){const code=canonical($('staff').value||''),ft=$('type').value,q=String($('search').value||'').trim().toLowerCase();if(!code){$('summary').textContent='Select a staff member to view complete approved history.';$('records').innerHTML='<div class="empty">Select one staff member.</div>';return}let a=rows.filter(r=>canonical(r.code)===code);if(ft)a=a.filter(r=>ft==='od'||ft==='special'?r.type===ft:r.cat===ft);if(q)a=a.filter(r=>[r.note,r.source,r.cat,label(r),...(r.dates||[])].some(v=>String(v||'').toLowerCase().includes(q)));$('summary').innerHTML=`<b>${a.length}</b> approved record${a.length===1?'':'s'} for the selected staff member.`;$('records').innerHTML=a.length?a.map(r=>{const ds=r.dates||[],dt=ds.length>1?`${fmt(ds[0])} → ${fmt(ds.at(-1))} · ${ds.length} dates`:fmt(ds[0]);const key=r.kind==='manual'?manualKey(r):r.id;return`<div class="record"><div class="recordTop"><div><div class="title">${esc(label(r))} ${r.cat?`<span class="pill">${esc(r.cat)}</span>`:''}</div><div class="meta"><b>${esc(dt)}</b>${r.note?`<br>${esc(r.note)}`:''}<br>Source: ${esc(r.source||'Approved')}</div></div><span class="pill">${r.kind==='manual'?'Daily':'Approved'}</span></div><div class="actions"><button class="primary" data-edit-kind="${r.kind}" data-edit-key="${esc(key)}">Edit</button><button class="danger" data-delete-kind="${r.kind}" data-delete-key="${esc(key)}">Delete</button></div></div>`}).join(''):'<div class="empty">No approved record matches the selected filters.</div>';document.querySelectorAll('[data-edit-key]').forEach(b=>b.onclick=()=>openEdit(b.dataset.editKind,b.dataset.editKey));document.querySelectorAll('[data-delete-key]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.deleteKind,b.dataset.deleteKey))}
async function ensurePlan(id){const r=rows.find(x=>x.kind==='plan'&&String(x.id)===String(id));if(!r)throw Error('Approved record not found.');const ref=doc(db,'dailyRecords','__leavePlans'),s=await getDoc(ref).catch(()=>null),data=s?.exists()?s.data()||{}:{},plans={...(data.plans||{})};if(!plans[id]){plans[id]={...r.raw,id,code:r.code,type:r.type,leaveCategory:r.cat,active:true,approved:true,source:r.source||'approvedStatusPlans'};await setDoc(ref,{...data,date:'__leavePlans',dayName:data.dayName||'Scheduled Leave / Status Plans',plans,updatedAt:serverTimestamp(),updatedBy:user.uid,updatedByEmail:user.email||''},{merge:false})}}
async function openEdit(kind,key){$('editTitle').textContent=kind==='manual'?'Edit daily approved record':'Edit approved record';$('historyShell').classList.add('hidden');$('editShell').classList.remove('hidden');pendingEdit={kind,key,code:canonical($('staff').value||'')};if(kind==='plan')await ensurePlan(key);const f=$('editorFrame');f.src='./admin-leave-editor-v64-clean.html?quick=1&v=20260916-direct-edit-1';f.onload=()=>{let n=0;const tryOpen=()=>{try{const d=f.contentDocument;if(!d)return;const sel=d.getElementById('filterTeacher');if(sel){sel.value=pendingEdit.code;sel.dispatchEvent(new Event('change',{bubbles:true}))}let b;if(kind==='manual')b=[...d.querySelectorAll('[data-edit-kind="manual"]')].find(x=>String(x.dataset.editKey||'')===String(key));else b=[...d.querySelectorAll('[data-edit-kind="plan"]')].find(x=>String(x.dataset.editKey||'')===String(key));if(b){b.click();return}if(++n<30)setTimeout(tryOpen,150)}catch(e){if(++n<30)setTimeout(tryOpen,150)}};setTimeout(tryOpen,120)}}
async function removeRecord(kind,key){const r=kind==='manual'?rows.find(x=>x.kind==='manual'&&manualKey(x)===key):rows.find(x=>x.kind==='plan'&&String(x.id)===String(key));if(!r)return;if(!confirm(`Delete this erroneous official record?\n\n${label(r)}\n${(r.dates||[]).map(fmt).join(', ')}\n\nThis action is for wrong or duplicate records only.`))return;if(kind==='plan'){const id=r.id,ref=doc(db,'dailyRecords','__leavePlans'),s=await getDoc(ref).catch(()=>null),data=s?.exists()?s.data()||{}:{},plans={...(data.plans||{})};for(const[k,v]of Object.entries(plans)){const vid=String(v?.id||v?.canonicalLeaveId||k);if(k===id||vid===id)delete plans[k]}await setDoc(ref,{...data,plans,updatedAt:serverTimestamp(),updatedBy:user.uid,updatedByEmail:user.email||''},{merge:false});await deleteDoc(doc(db,'approvedStatusPlans',id)).catch(()=>{});for(const date of r.dates||[]){const ar=doc(db,'approvedDailyStatus',date),as=await getDoc(ar).catch(()=>null);if(as?.exists()){const old=as.data()||{},next=(old.statuses||[]).filter(x=>![String(x?.id||''),String(x?.canonicalLeaveId||''),String(x?.projectionPlanId||'')].includes(id));if(next.length)await setDoc(ar,{...old,statuses:next,updatedAt:serverTimestamp()},{merge:false});else await deleteDoc(ar).catch(()=>{})}}}else{const [docId,idxText,date,code]=key.split('|'),idx=Number(idxText),ref=doc(db,'dailyRecords',docId),s=await getDoc(ref);if(s.exists()){const old=s.data()||{},arr=old.statuses||[],next=arr.filter((x,i)=>!(i===idx&&canonical(x.code||x.teacherCode||'')===canonical(code)));if(next.length)await setDoc(ref,{...old,statuses:next,updatedAt:serverTimestamp()},{merge:false});else await deleteDoc(ref).catch(()=>{})}}await setDoc(doc(db,'leaveApprovalAudit',`direct_delete_${Date.now()}_${Math.random().toString(36).slice(2,7)}`),{action:'deleted_erroneous_official_record',staffCode:r.code,officialPlanId:r.id||'',affectedDates:r.dates||[],actedByUid:user.uid,actedByEmail:user.email||'',actedAt:serverTimestamp()});await loadRows();render()}
async function openNew(){const code=canonical($('staff').value||'');$('editTitle').textContent='New approved Leave / Duty record';$('historyShell').classList.add('hidden');$('editShell').classList.remove('hidden');const f=$('editorFrame');f.src='./admin-leave-editor-v64-clean.html?quick=1&v=20260916-direct-edit-1';f.onload=()=>{let n=0;const go=()=>{try{const d=f.contentDocument,b=d?.getElementById('newBtn');if(b){b.click();if(code){const s=d.getElementById('editTeacher');if(s)s.value=code}return}if(++n<30)setTimeout(go,150)}catch(e){if(++n<30)setTimeout(go,150)}};setTimeout(go,120)}}
$('backBtn').onclick=async()=>{$('editorFrame').src='about:blank';$('editShell').classList.add('hidden');$('historyShell').classList.remove('hidden');await loadRows();render()};$('newBtn').onclick=openNew;$('staff').onchange=render;$('type').onchange=render;$('search').oninput=render;$('reset').onclick=()=>{$('type').value='';$('search').value='';render()};
try{await verify();await loadRows();$('staff').innerHTML='<option value="">Select staff member…</option>'+staffList().map(x=>`<option value="${esc(x.code)}">${esc(x.name)} (${esc(x.code)})</option>`).join('');$('gate').className='status ok';$('gate').textContent='Principal/Admin access confirmed.';$('app').classList.remove('hidden');render()}catch(e){$('gate').className='status warn';$('gate').textContent=e.message||e}
</script>
