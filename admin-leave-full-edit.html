<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';

const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),frame=document.getElementById('editorFrame'),note=document.getElementById('note');
await setPersistence(auth,browserLocalPersistence).catch(()=>{});if(auth.authStateReady)await auth.authStateReady().catch(()=>{});
let approvedExtras=new Map(),extrasLoaded=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function datesOf(p){if(Array.isArray(p?.dates)&&p.dates.length)return[...new Set(p.dates.filter(Boolean))].sort();const a=p?.startDate||p?.date||'',b=p?.endDate||a;if(!a)return[];if(!b||a===b)return[a];const out=[],d=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00');for(let i=0;d<=z&&i<370;i++,d.setDate(d.getDate()+1))out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return out}
function fmt(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s||'—')}
async function admin(){const u=auth.currentUser;if(!u)return null;const s=await getDoc(doc(db,'authorizedUsers',u.uid)).catch(()=>null);return s?.exists()&&s.data().active===true&&String(s.data().role||'').toLowerCase()==='admin'?u:null}
function sig(x){return [String(x?.code||x?.teacherCode||''),String(x?.type||x?.statusType||''),String(x?.from||x?.fromPeriod||''),String(x?.to||x?.toPeriod||''),String(x?.note||x?.remarks||''),String(x?.date||x?.startDate||'')].join('|')}
function flattenApproved(id,p){const e=Array.isArray(p?.entries)&&p.entries.length?p.entries[0]:{},x={...p,...e,id};x.code=String(x.code||x.teacherCode||x.staffCode||'');let t=String(x.type||x.statusType||'').toLowerCase();if(['leave','regularleave','regular leave'].includes(t)){const cov=String(x.coverage||x.duration||'').toLowerCase();t=cov.includes('half')?'half':'full'}if(['on duty','duty','duty leave'].includes(t))t='od';if(['special assignment','assignment'].includes(t))t='special';x.type=t;x.leaveCategory=x.leaveCategory||x.category||'';x.note=x.note||x.remarks||x.reason||'';x.active=x.active!==false;x.source=x.source||'approvedStatusPlans';return x}
async function loadApprovedExtras(){approvedExtras=new Map();try{const q=await getDocs(collection(db,'approvedStatusPlans'));q.forEach(d=>approvedExtras.set(d.id,flattenApproved(d.id,d.data()||{})));extrasLoaded=true}catch(e){extrasLoaded=false;console.warn('Full Leave Edit approved history:',e)}}
async function resolveRecord(id){let snap=await getDoc(doc(db,'approvedStatusPlans',id)).catch(()=>null);if(snap?.exists())return{id,data:flattenApproved(id,snap.data()||{})};const ms=await getDoc(doc(db,'dailyRecords','__leavePlans')).catch(()=>null),plans=ms?.exists()?(ms.data().plans||{}):{},p=plans[id];return p?{id,data:p}:null}
async function cascadePlanDelete(id){const u=await admin();if(!u)throw Error('Principal/Admin access is required.');const rec=await resolveRecord(id);if(!rec)throw Error('This official record could not be found. It may already have been removed.');const p=rec.data,dates=datesOf(p),who=p.teacherName||p.staffName||p.code||p.teacherCode||'this staff member',kind=p.type==='special'?'Special Assignment':p.type==='od'?'On Duty':p.leaveCategory||p.type||'Leave / Duty';if(!confirm(`DELETE ERRONEOUS OFFICIAL RECORD\n\n${who}\n${kind}\n${dates.map(fmt).join(', ')||'Date unavailable'}\n\nThis removes the approved record and its linked Proxy/day projection. Use this only when the record itself is wrong or duplicated.\n\nContinue?`))return;const masterRef=doc(db,'dailyRecords','__leavePlans'),ms=await getDoc(masterRef).catch(()=>null),master=ms?.exists()?ms.data()||{}:{},plans={...(master.plans||{})};for(const[k,v]of Object.entries(plans)){const vid=String(v?.id||v?.canonicalLeaveId||k);if(k===id||vid===id)delete plans[k]}await setDoc(masterRef,{...master,plans,updatedAt:serverTimestamp(),updatedBy:u.uid,updatedByEmail:u.email||''},{merge:false});await deleteDoc(doc(db,'approvedStatusPlans',id)).catch(()=>{});for(const date of dates){const ref=doc(db,'approvedDailyStatus',date),s=await getDoc(ref).catch(()=>null);if(!s?.exists())continue;const old=s.data()||{},statuses=(Array.isArray(old.statuses)?old.statuses:[]).filter(x=>![String(x?.id||''),String(x?.canonicalLeaveId||''),String(x?.projectionPlanId||'')].includes(id));if(statuses.length)await setDoc(ref,{...old,statuses,projectionUpdatedAt:serverTimestamp(),projectionUpdatedBy:u.uid,projectionUpdatedByEmail:u.email||''},{merge:false});else await deleteDoc(ref).catch(()=>{})}const now=Date.now();await setDoc(doc(db,'leaveApprovalAudit',`full_edit_delete_${now}_${Math.random().toString(36).slice(2,7)}`),{action:'deleted_erroneous_official_record',officialPlanId:id,staffCode:p.code||p.teacherCode||'',staffName:who,type:p.type||'',leaveCategory:p.leaveCategory||'',affectedDates:dates,actedByUid:u.uid,actedByEmail:u.email||'',actedAtMs:now,actedAt:serverTimestamp()});approvedExtras.delete(id);alert('Erroneous official record and linked Proxy/day projection removed.');frame.contentWindow.location.reload()}
async function cascadeManualDelete(key){const u=await admin();if(!u)throw Error('Principal/Admin access is required.');const [docId,indexText,date,code]=String(key||'').split('|'),idx=Number(indexText);if(!docId||!date||!code||!Number.isInteger(idx))throw Error('This daily official record could not be identified safely.');const ref=doc(db,'dailyRecords',docId),s=await getDoc(ref).catch(()=>null);if(!s?.exists())throw Error('This daily official record no longer exists.');const old=s.data()||{},arr=Array.isArray(old.statuses)?old.statuses:[],target=arr[idx];if(!target||String(target.code||target.teacherCode||'')!==code)throw Error('The selected daily record changed. Refresh and try again.');if(!confirm(`DELETE ERRONEOUS DAILY OFFICIAL RECORD\n\n${code}\n${fmt(date)}\n${target.type||target.statusType||'Leave / Duty'}\n\nThis removes the daily official status and its matching Proxy projection. Continue?`))return;const targetSig=sig(target),statuses=arr.filter((x,i)=>!(i===idx&&sig(x)===targetSig));if(statuses.length)await setDoc(ref,{...old,statuses,updatedAt:serverTimestamp(),updatedBy:u.uid,updatedByEmail:u.email||''},{merge:false});else await deleteDoc(ref).catch(()=>{});const ar=doc(db,'approvedDailyStatus',date),as=await getDoc(ar).catch(()=>null);if(as?.exists()){const data=as.data()||{},next=(Array.isArray(data.statuses)?data.statuses:[]).filter(x=>sig(x)!==targetSig);if(next.length)await setDoc(ar,{...data,statuses:next,updatedAt:serverTimestamp(),updatedBy:u.uid,updatedByEmail:u.email||''},{merge:false});else await deleteDoc(ar).catch(()=>{})}const now=Date.now();await setDoc(doc(db,'leaveApprovalAudit',`full_edit_manual_delete_${now}_${Math.random().toString(36).slice(2,7)}`),{action:'deleted_erroneous_daily_official_record',dailyRecordId:docId,staffCode:code,affectedDates:[date],before:target,actedByUid:u.uid,actedByEmail:u.email||'',actedAtMs:now,actedAt:serverTimestamp()});alert('Erroneous daily official record and matching Proxy projection removed.');frame.contentWindow.location.reload()}
async function migrateApprovedForEdit(id){const u=await admin();if(!u)throw Error('Principal/Admin access is required.');let p=approvedExtras.get(id);if(!p){const s=await getDoc(doc(db,'approvedStatusPlans',id));if(!s.exists())throw Error('Approved record is no longer available.');p=flattenApproved(id,s.data()||{})}if(!p.code)throw Error('This approved record has no staff code and cannot be reconciled safely.');if(!['full','half','od','special'].includes(String(p.type||'')))throw Error('This approved record has an unsupported status type: '+String(p.type||'unknown'));const ref=doc(db,'dailyRecords','__leavePlans'),s=await getDoc(ref).catch(()=>null),data=s?.exists()?s.data()||{}:{},plans={...(data.plans||{})};plans[id]={...p,id,active:p.active!==false,approved:true,source:p.source||'approvedStatusPlans-reconciled'};await setDoc(ref,{...data,date:'__leavePlans',dayName:data.dayName||'Scheduled Leave / Status Plans',plans,updatedAt:serverTimestamp(),updatedBy:u.uid,updatedByEmail:u.email||''},{merge:false});const now=Date.now();await setDoc(doc(db,'leaveApprovalAudit',`reconcile_for_edit_${now}_${Math.random().toString(36).slice(2,7)}`),{action:'reconciled_approved_record_into_leave_master_for_edit',officialPlanId:id,staffCode:p.code,affectedDates:datesOf(p),actedByUid:u.uid,actedByEmail:u.email||'',actedAtMs:now,actedAt:serverTimestamp()});sessionStorage.setItem('vkvLeaveEditAfterMigration',JSON.stringify({id,code:p.code}));frame.contentWindow.location.reload()}
function statusLabel(p){return p.type==='od'?'On Duty (OD)':p.type==='special'?'Special Assignment':p.type==='half'?'Half Leave':p.leaveCategory||'Full Leave'}
function renderApprovedExtras(){try{const d=frame.contentDocument,sel=d?.getElementById('filterTeacher'),list=d?.getElementById('recordList');if(!d||!sel||!list)return;let host=d.getElementById('vkvApprovedExtras');if(!host){host=d.createElement('div');host.id='vkvApprovedExtras';host.className='vkv-extra-history';list.insertAdjacentElement('beforebegin',host)}const code=String(sel.value||'');if(!code){host.style.display='none';return}const visibleIds=new Set([...d.querySelectorAll('[data-edit-key]')].map(x=>String(x.dataset.editKey||'')));const rows=[...approvedExtras.values()].filter(p=>p.active!==false&&String(p.code||'')===code&&!visibleIds.has(String(p.id)));if(!rows.length){host.style.display='none';return}host.style.display='block';rows.sort((a,b)=>String(datesOf(b).at(-1)||'').localeCompare(String(datesOf(a).at(-1)||'')));host.innerHTML=`<h3>📚 Approved history found outside the Leave Master</h3><div class="vkv-extra-help">These are genuine approved records from the approval register that the old Full Edit page was not loading. Bring a record into the Leave Master to edit it safely.</div>${rows.map(p=>{const ds=datesOf(p),dt=ds.length>1?`${fmt(ds[0])} → ${fmt(ds.at(-1))} · ${ds.length} dates`:fmt(ds[0]);return`<div class="vkv-extra-record"><b>${esc(statusLabel(p))}</b><div class="vkv-extra-meta">${esc(dt)}${p.note?` · ${esc(p.note)}`:''}<br>Source: ${esc(p.source||'approvedStatusPlans')}</div><button type="button" data-vkv-migrate-edit="${esc(p.id)}">Bring into Leave Master & Edit</button></div>`}).join('')}`;host.querySelectorAll('[data-vkv-migrate-edit]').forEach(b=>b.onclick=()=>migrateApprovedForEdit(b.dataset.vkvMigrateEdit).catch(e=>alert('Could not prepare this record for editing: '+(e?.message||e))))}catch(e){console.warn('Render approved extras:',e)}}
function resumeMigratedEdit(){try{const raw=sessionStorage.getItem('vkvLeaveEditAfterMigration');if(!raw)return;const p=JSON.parse(raw),d=frame.contentDocument,sel=d?.getElementById('filterTeacher');if(!d||!sel)return;sel.value=p.code||'';sel.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>{const b=[...d.querySelectorAll('[data-edit-key]')].find(x=>String(x.dataset.editKey||'')===String(p.id));if(b){sessionStorage.removeItem('vkvLeaveEditAfterMigration');b.click()}},150)}catch(e){sessionStorage.removeItem('vkvLeaveEditAfterMigration')}}
function install(){try{const d=frame.contentDocument;if(!d?.body)return false;note.classList.add('hide');d.querySelectorAll('[data-archive-key]').forEach(a=>{if(a.parentElement?.querySelector('.vkv-delete-erroneous'))return;const b=d.createElement('button');b.type='button';b.className='danger vkv-delete-erroneous';b.textContent='Delete Erroneous Record';b.onclick=()=>{const p=a.dataset.archiveKind==='manual'?cascadeManualDelete(a.dataset.archiveKey):cascadePlanDelete(a.dataset.archiveKey);Promise.resolve(p).catch(e=>alert('Delete failed: '+(e?.message||e)))};a.insertAdjacentElement('afterend',b)});const sel=d.getElementById('filterTeacher');if(sel&&!sel.dataset.vkvHistoryBound){sel.dataset.vkvHistoryBound='1';sel.addEventListener('change',()=>setTimeout(renderApprovedExtras,20))}renderApprovedExtras();resumeMigratedEdit();return true}catch(e){return false}}
async function startInstaller(){if(!extrasLoaded)await loadApprovedExtras();let n=0;const run=()=>{const ok=install();if(++n<30)setTimeout(run,250);else if(!ok)note.textContent='The leave editor loaded, but complete approved history could not be attached.'};run()}
