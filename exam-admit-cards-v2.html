<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VKV Nalbari · Bulk Admit Cards</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="admitFrame" src="exam-admit-cards.html"></iframe>
<script>
const frame=document.getElementById('admitFrame');
const qs=new URLSearchParams(location.search);
const exam=qs.get('exam');
if(exam) frame.src='exam-admit-cards.html?exam='+encodeURIComponent(exam);
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;

  const style=d.createElement('style');
  style.textContent=`
    /* Readability/contrast hardening for the complete Bulk Admit Cards workspace. */
    body{color:#12263a!important}
    header{color:#fff!important}
    header .brand{color:#fff!important}
    header .back{color:#fff!important;text-shadow:0 1px 1px rgba(0,0,0,.22)!important}
    header .sub{color:#e8f2fa!important;opacity:1!important;font-weight:600!important}
    h1,h2,h3,h4{color:#12324d!important}
    .card h2{color:#12324d!important}
    label{color:#30465c!important}
    .callout{color:#294b69!important;background:#f2f7fd!important}
    .stat span,.modal p,.screenonly small{color:#52677c!important}
    th{color:#334d66!important;background:#f4f8fb!important}
    td{color:#20384d!important}
    .ghost{color:#12324d!important;background:#eef6fb!important;border-color:#b8cedd!important}
    .secondary{color:#12324d!important}
    button small{color:inherit!important;opacity:1!important}
    button:disabled{opacity:.68!important;color:#52677c!important}
    input,select{color:#18344a!important;background:#fff!important}
    input::placeholder{color:#6a7e91!important;opacity:1!important}
    .progress #progressDetail{color:#52677c!important}
    .screenonly[style*="color:var(--muted)"]{color:#52677c!important}
    .signs{margin-top:3.5mm!important;font-size:8.3px!important}
    .sigbox{min-height:10.5mm!important}
    .sigbox img{display:block!important;max-height:7.5mm!important;max-width:28mm!important;width:auto!important;height:auto!important;object-fit:contain!important;margin:0 auto .8mm!important}
    @media print{.admit{padding-bottom:5.5mm!important}}
  `;
  d.head.appendChild(style);

  if(!d.getElementById('swamiPhotoHotfix')){
    const examSig=d.getElementById('examSig');
    const target=examSig?.parentElement?.parentElement;
    if(target){
      const box=d.createElement('div');
      box.innerHTML='<label>Swamiji Photograph</label><input id="swamiPhotoHotfix" type="file" accept="image/*">';
      target.insertBefore(box,target.firstChild);
      const input=box.querySelector('input');
      input.addEventListener('change',e=>{
        const f=e.target.files&&e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=()=>{sessionStorage.setItem('vkvtt-swami-photo',r.result);applySwami(r.result)};
        r.readAsDataURL(f);
      });
    }
  }

  function applySwami(src){
    if(!src)return;
    d.querySelectorAll('.achead img').forEach((img,i)=>{if(i%2===1 && img.src!==src)img.src=src});
    d.querySelectorAll('img[src*="swamiji-portrait"]').forEach(img=>{if(img.src!==src)img.src=src});
  }

  function normalClass(v){
    return String(v||'').trim().toUpperCase().replace(/\s+/g,'').replace(/_/g,'-');
  }
  function isAssessmentClass(v){
    const c=normalClass(v);
    return ['B1','B2','B3','BALVATIKA-1','BALVATIKA1','BALVATIKA-2','BALVATIKA2','BALVATIKA-3','BALVATIKA3','I','II','1','2'].includes(c);
  }
  function applyTicketTitles(){
    d.querySelectorAll('.admit').forEach(card=>{
      let classValue='';
      card.querySelectorAll('.field').forEach(field=>{
        const label=field.querySelector('b')?.textContent?.trim().toLowerCase();
        if(label==='class:') classValue=field.querySelector('span')?.textContent?.trim()||'';
      });
      const title=card.querySelector('.school .title');
      if(title){
        const wanted=isAssessmentClass(classValue)?'ASSESSMENT TICKET':'ADMIT CARD';
        if(title.textContent!==wanted) title.textContent=wanted;
      }
    });
  }

  const saved=sessionStorage.getItem('vkvtt-swami-photo');
  if(saved)applySwami(saved);
  applyTicketTitles();

  let scheduled=false;
  const refresh=()=>{
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(()=>{
      scheduled=false;
      const src=sessionStorage.getItem('vkvtt-swami-photo');
      if(src)applySwami(src);
      applyTicketTitles();
    });
  };
  new MutationObserver(refresh).observe(d.body,{childList:true,subtree:true});
});
</script>
</body>
</html>
